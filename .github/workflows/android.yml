
name: MR OCTAPAD APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Project
        run: |
          unzip -q MR-KAYLUU-MOBILE-OCTAPAD-Android.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source/MR-OCTAPAD assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MR-KAYLUU-OCTAPAD-APK
          path: source/MR-OCTAPAD/app/build/outputs/apk/debug/*.apk
